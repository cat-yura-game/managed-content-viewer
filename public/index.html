<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Просмотр содержимого выбранного администратором источника." />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>Просмотр источника</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23101828'/%3E%3Cpath d='M8 10h16v12H8z' fill='none' stroke='%236be7c8' stroke-width='2'/%3E%3Cpath d='M12 15h8M12 19h5' stroke='%236be7c8' stroke-width='2'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="viewer-page">
    <header class="topbar">
      <div class="brand" aria-label="Просмотр источника">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>Просмотр источника</span>
      </div>
      <div class="source-line">
        <span class="source-label">Источник</span>
        <a id="sourceLink" href="#" target="_blank" rel="noopener noreferrer">Загрузка…</a>
      </div>
      <a class="admin-link" href="/admin.html">Админ</a>
    </header>

    <main class="viewer-shell">
      <section id="loadingState" class="state-card" aria-live="polite">
        <span class="spinner" aria-hidden="true"></span>
        <div>
          <h1>Открываем источник</h1>
          <p>Получаем актуальный адрес.</p>
        </div>
      </section>

      <section id="errorState" class="state-card state-error" hidden>
        <span class="state-icon" aria-hidden="true">!</span>
        <div>
          <h1>Не удалось загрузить настройку</h1>
          <p id="errorText">Попробуйте обновить страницу.</p>
          <button id="retryButton" class="button button-primary" type="button">Повторить</button>
        </div>
      </section>

      <iframe
        id="contentFrame"
        title="Содержимое внешнего источника"
        sandbox="allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts"
        referrerpolicy="strict-origin-when-cross-origin"
        hidden
      ></iframe>

      <div id="frameNotice" class="frame-notice" hidden>
        Если содержимое не появилось, сайт-источник может запрещать встраивание.
        <a id="openDirectLink" href="#" target="_blank" rel="noopener noreferrer">Открыть источник отдельно</a>
      </div>
    </main>

    <script src="/viewer.js" defer></script>
  </body>
</html>
